<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Login Form</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
  body{
    min-height:100vh;
    background:#1a1625;
    display:flex; align-items:center; justify-content:center;
  }
  /* ORANGE STAGE */
  .stage{
    width:700px; height:420px;
    background:#ff9a5a;
    position:relative;
    overflow:hidden;
    border-radius:8px;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
  }
  /* GROUND LINE */
  .ground{
    position:absolute; bottom:45px; left:0;
    width:100%; height:2px; background:rgba(0,0,0,0.15);
  }
  /* MAN - walks in */
  .man{
    position:absolute; bottom:45px; left:-100px;
    font-size:90px; line-height:1;
    animation: walkIn 3s forwards ease-in-out, idle 1s 3s infinite;
    z-index:2;
  }
  @keyframes walkIn{
    0%{ left:-100px; }
    70%{ left:120px; }
    85%{ left:150px; }
    100%{ left:130px; }
  }
  @keyframes idle{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-3px); }
  }
  /* BAG - drops */
  .bag{
    position:absolute; bottom:300px; left:230px;
    font-size:48px;
    opacity:0;
    animation: dropBag 0.8s 2.2s forwards ease-in;
    z-index:1;
  }
  @keyframes dropBag{
    0%{ opacity:1; bottom:300px; transform:rotate(0deg); }
    80%{ bottom:50px; }
    100%{ opacity:1; bottom:48px; transform:rotate(0deg); }
  }
  /* FORM - pops up after bag drops */
  .form-box{
    position:absolute;
    top:50%; right:60px;
    transform:translateY(-50%) scale(0);
    width:300px;
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
    animation: popForm 0.7s 3.5s forwards cubic-bezier(.2,1.5,.4,1);
    z-index:3;
  }
  @keyframes popForm{
    to{ transform:translateY(-50%) scale(1); }
  }
  .form-box h2{ text-align:center; font-size:20px; margin-bottom:16px; color:#333; }
  .form-box label{ font-size:12px; color:#666; }
  .form-box input{
    width:100%; padding:10px; margin:4px 0 12px;
    border:1px solid #ddd; border-radius:6px; outline:none;
  }
  .form-box input:focus{ border-color:#ff6b3d; }
  .form-box button{
    width:100%; padding:11px; border:none; border-radius:6px;
    background:#ff4d4d; color:white; font-weight:bold; font-size:14px;
    cursor:pointer;
  }
  .form-box p{ text-align:center; font-size:11px; margin-top:12px; color:#999; }
  .form-box p a{ color:#ff4d4d; text-decoration:none; }

  /* REPLAY BUTTON */
  .replay{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.2); color:white; border:none;
    padding:6px 14px; border-radius:20px; cursor:pointer; font-size:12px;
  }
</style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="ground"></div>

    <!-- MAN -->
    <div class="man">🚶‍♂️</div>

    <!-- BAG -->
    <div class="bag">💼</div>

    <!-- LOGIN FORM -->
    <div class="form-box">
      <h2>Register Now</h2>
      <label>Username</label>
      <input type="text" placeholder="Enter username">
      <label>Email</label>
      <input type="email" placeholder="Enter email">
      <label>Password</label>
      <input type="password" placeholder="Enter password">
      <button onclick="alert('Registered!')">REGISTER</button>
      <p>Already have an account? <a href="#">Login</a></p>
    </div>

    <button class="replay" onclick="location.reload()">↻ Replay</button>
  </div>

</body>
</html>
